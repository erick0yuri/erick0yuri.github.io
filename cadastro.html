<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de cliente</title>
</head>
<body>
    <p>
    <a href="../menu.html">Menu</a>
    </p>
    
    <h1>Informações Pessoais</h1>

    <form action="../menu.html">
        <fieldset>
            <legend>Cadastro do Cliente</legend>
           <br>
            <div>
                <label>Nome:</label>
                <input type="text" size="50" maxlength="150" placeholder="Digite o nome do cliente">
            </div>
            <br>
            <div>
                <label>Idade:</label>
                <input type="text" size="15 maxlength="150" placeholder="Digite a idade">
            </div>
            <br>
            <div>
                <label>Endereço::</label>
                <br>
                <input type="text" size="100 maxlength="150" placeholder="Digite o endereço">
            </div>
            <br>
            <div>
                <label>Cidade:</label>
                <input type="text" size="50" maxlength="150" placeholder="Digite a cidade">
            </div>
            <br>
            <div>
                <label>Estado:</label>
                <select name="opcoes" placeholder="UF">
                    <option value="opt1">AC</option>
                    <option value="opt2">AL</option>
                    <option value="opt3">AP</option>
                    <option value="opt4">AM</option>
                    <option value="opt5">BA</option>
                    <option value="opt6">CE</option>
                    <option value="opt7">ES</option>
                    <option value="opt8">GO E DF</option>
                    <option value="opt9">MA</option>
                    <option value="opt10">MT</option>
                    <option value="opt11">MS</option>
                    <option value="opt12">MG</option>
                    <option value="opt13">PA</option>
                    <option value="opt14">PB</option>
                    <option value="opt15">PR</option>
                    <option value="opt16">PE</option>
                    <option value="opt17">PI</option>
                    <option value="opt18">RJ</option>
                    <option value="opt19">RN</option>
                    <option value="opt20">RS</option>
                    <option value="opt21">RO</option>
                    <option value="opt22">RR</option>
                    <option value="opt23">SC</option>
                    <option value="opt24">SP</option>
                    <option value="opt25">SE</option>
                    <option value="opt26">TO</option>
                </select>
            </div>
            <br>
            <div>
                <label>CEP:</label>
                <input type="number" size="30" maxlength="150" placeholder="XXXXX-XXX">
            </div>
            <br>
            <div>
                <label>Tel/Res:</label>
                <input type="number" size="40" maxlength="150" placeholder="99 99999-9999">
            </div>
            <br>
            <div>
                <label>Tel/Cel:</label>
                <input type="number" size="40" maxlength="150" placeholder="99 99999-9999">
            </div>
            <br>
            <div>
                <label>Email:</label>
                <br>
                <input type="text" size="100" maxlength="150" placeholder="Digite o endereço de email">
            </div>
            <br>        
        </fieldset>
        <input type="submit" value="enviar">  


</body>
</html>
